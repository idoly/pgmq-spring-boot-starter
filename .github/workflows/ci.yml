name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  compatibility:
    name: Spring Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: [boot35, boot40, boot41]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Compile and package
        run: mvn --batch-mode --no-transfer-progress -P${{ matrix.boot }} -DskipTests package

  test:
    name: Unit and integration tests (Podman)
    runs-on: ubuntu-latest
    env:
      DOCKER_HOST: unix://${{ runner.temp }}/podman.sock
      TESTCONTAINERS_RYUK_DISABLED: "true"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Install Podman
        run: |
          sudo apt-get update
          sudo apt-get install --yes podman
          podman --version
      - name: Run tests with Podman
        shell: bash
        run: |
          set -euo pipefail
          podman system service --time=0 "$DOCKER_HOST" >"$RUNNER_TEMP/podman.log" 2>&1 &
          service_pid=$!
          trap 'kill "$service_pid" 2>/dev/null || true' EXIT
          for attempt in {1..30}; do
            [ -S "$RUNNER_TEMP/podman.sock" ] && break
            sleep 1
          done
          [ -S "$RUNNER_TEMP/podman.sock" ] || { cat "$RUNNER_TEMP/podman.log"; exit 1; }
          podman info
          mvn --batch-mode --no-transfer-progress test
