name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  verify:
    name: Spring Boot ${{ matrix.boot }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        boot: [boot35, boot40, boot41]
    env:
      PGMQ_TEST_JDBC_URL: jdbc:postgresql://127.0.0.1:5432/pgmq_test
      PGMQ_TEST_USERNAME: postgres
      PGMQ_TEST_PASSWORD: postgres
      PGMQ_TEST_REQUIRE_PARTMAN: "true"
    services:
      postgres:
        image: ghcr.io/dbsystel/postgresql-partman@sha256:c12e31bdd5e16ea72b88f30bbf96b539368f747a8c7896880a22b3cf0741a6f0
        env:
          POSTGRES_DB: pgmq_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -h 127.0.0.1 -U postgres -d pgmq_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Test, measure coverage and package
        run: mvn --batch-mode --no-transfer-progress -P${{ matrix.boot }},coverage clean verify
      - name: Upload verification reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: verification-${{ matrix.boot }}
          path: |
            target/surefire-reports
            target/site/jacoco
